name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk

      # Публикуем APK в Releases: постоянная ссылка
      # https://github.com/<owner>/<repo>/releases/latest/download/calculator.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Калькулятор 1.${{ github.run_number }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Скачайте `calculator.apk` и откройте его на телефоне.
          files: calculator.apk
          make_latest: true
