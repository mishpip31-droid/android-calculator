name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check rate APIs (info only)
        continue-on-error: true
        run: |
          for u in "https://api.nbrb.by/exrates/rates/USD?parammode=2" \
                   "https://api.nbrb.by/exrates/rates/EUR?parammode=2" \
                   "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd" \
                   "https://api.coinbase.com/v2/prices/BTC-USD/spot"; do
            echo "== $u"; curl -sS -m 15 "$u" | head -c 400; echo
          done
          for u in "https://myfin.by/currency/usd" "https://myfin.by/currency/eur"; do
            echo "== $u bank rows:"; curl -sS -L -m 30 -A "Mozilla/5.0 (Linux; Android) Calculator" "$u" | grep -o 'data-row-type="default"' | wc -l
          done
          echo "== belarusbank"; curl -sS -m 20 "https://belarusbank.by/api/kursExchange?city=%D0%9C%D0%B8%D0%BD%D1%81%D0%BA" | head -c 200; echo

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk

      # Публикуем APK в Releases: постоянная ссылка
      # https://github.com/<owner>/<repo>/releases/latest/download/calculator.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Калькулятор 1.${{ github.run_number }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Скачайте `calculator.apk` и откройте его на телефоне.
          files: calculator.apk
          make_latest: true
