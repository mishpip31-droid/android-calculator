name: Probe bank rate sources (temporary)

on:
  push:
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe myfin EUR
        run: |
          for u in "https://myfin.by/currency/eur/minsk" "https://myfin.by/currency/minsk/eur" "https://myfin.by/currency/usd/minsk" "https://myfin.by/currency/eur"; do
            echo "=================== $u"
            curl -sS -L -m 30 -A "Mozilla/5.0 (Linux; Android 14) Calculator" -o m.html -w "HTTP %{http_code} size %{size_download} final %{url_effective}\n" "$u" || true
            python3 - <<'PY'
          import re
          s = open('m.html', encoding='utf-8', errors='replace').read()
          heads = re.findall(r'(Сдать|Купить)\s*<div>([A-Z]{3})</div>', s)
          print("heads", heads[:6])
          rows = re.findall(r'<tr class="currencies-courses__row-main[^"]*" data-row-type="([^"]*)"[^>]*data-bank-sef-alias="([^"]*)">(.*?)</tr>', s, re.S)
          print("rows", len(rows))
          for t, alias, body in rows[:40]:
              if t == 'ad': continue
              name = re.search(r'alt="([^"]*)"', body)
              vals = re.findall(r'currencies-courses__currency-cell[^"]*"\s*>\s*<span[^>]*>\s*([\d.,-]+)\s*</span>', body)
              print(alias, '|', name.group(1) if name else None, '|', vals)
          print("title", re.search(r'<title>(.*?)</title>', s, re.S).group(1)[:120] if '<title>' in s else None)
          PY
          done
