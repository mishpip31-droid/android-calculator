name: Probe bank rate sources (temporary)

on:
  push:
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe myfin
        run: |
          curl -sS -L -m 30 -A "Mozilla/5.0 (Linux; Android 14) Calculator" -o m.html "https://myfin.by/currency/minsk"
          python3 - <<'PY'
          import re
          s = open('m.html', encoding='utf-8').read()
          print("len", len(s))
          rows = [m.start() for m in re.finditer(r'<tr class="currencies-courses__row-main', s)]
          print("rows", len(rows))
          kinds = re.findall(r'<tr class="currencies-courses__row-main[^"]*" data-row-type="([^"]*)" data-bank-sef-alias="([^"]*)"', s)
          print("kinds", kinds[:60])
          # first non-ad row
          for i, pos in enumerate(rows):
              chunk = s[pos:pos+4000]
              if 'data-row-type="ad"' not in chunk[:200]:
                  print("---- NON-AD ROW", i)
                  print(re.sub(r'\s+', ' ', chunk[:3500]))
                  break
          print("---- AD ROW 0")
          print(re.sub(r'\s+', ' ', s[rows[0]:rows[0]+3000]))
          # table headers
          h = s.find('currencies-courses__table')
          print("---- TABLE HEAD")
          print(re.sub(r'\s+', ' ', s[h-200:h+2500]))
          print("---- json hints", re.findall(r'(https?://[^"\']*(?:api|json)[^"\']*)', s)[:20])
          PY
